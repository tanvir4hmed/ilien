<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">ILIEN AWS architecture</title><desc id="desc">Evidence-preserving textile coordination using AWS Lambda, Amazon Bedrock, SES, AWS End User Messaging Social, SNS, SQS, Aurora, S3 and Secrets Manager.</desc>
  <defs><style>text{font-family:Arial,sans-serif;fill:#102a43}.title{font-size:30px;font-weight:700}.sub{font-size:16px;fill:#486581}.label{font-size:18px;font-weight:700}.small{font-size:14px;fill:#486581}.aws{fill:#fff4e5;stroke:#ec7211;stroke-width:2}.core{fill:#e8f2ff;stroke:#147eb3;stroke-width:2}.store{fill:#eef9f0;stroke:#2e8b57;stroke-width:2}.external{fill:#faf5ff;stroke:#7657ad;stroke-width:2}.line{stroke:#627d98;stroke-width:3;fill:none;marker-end:url(#arrow)}.dash{stroke:#627d98;stroke-width:3;fill:none;stroke-dasharray:8 7;marker-end:url(#arrow)}</style><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#627d98"/></marker></defs>
  <rect width="1600" height="900" fill="#f8fbfd"/><text x="70" y="75" class="title">ILIEN — evidence-preserving textile coordination</text><text x="70" y="105" class="sub">AWS Communication Developer Services is the messaging backbone; the agent coordinates evidence, not factory execution.</text>
  <rect x="70" y="360" width="190" height="110" rx="16" class="external"/><text x="95" y="405" class="label">Source request</text><text x="95" y="432" class="small">ERP, operator or API</text>
  <rect x="350" y="335" width="220" height="160" rx="16" class="core"/><text x="382" y="382" class="label">API intake</text><text x="382" y="411" class="small">validate • preserve source</text><text x="382" y="435" class="small">create case &amp; evidence</text>
  <rect x="670" y="130" width="210" height="120" rx="16" class="aws"/><text x="704" y="178" class="label">Amazon SNS</text><text x="704" y="205" class="small">WhatsApp events</text>
  <rect x="670" y="335" width="210" height="160" rx="16" class="aws"/><text x="704" y="382" class="label">Amazon SQS</text><text x="704" y="410" class="small">durable work &amp; retries</text>
  <rect x="980" y="285" width="245" height="260" rx="16" class="aws"/><text x="1022" y="333" class="label">AWS Lambda</text><text x="1022" y="362" class="small">coordination workers</text><text x="1022" y="387" class="small">message rendering</text><text x="1022" y="412" class="small">inbound evaluation</text><text x="1022" y="437" class="small">delivery &amp; outcomes</text>
  <rect x="980" y="640" width="245" height="120" rx="16" class="core"/><text x="1016" y="688" class="label">Amazon Bedrock</text><text x="1016" y="715" class="small">bounded action proposal</text>
  <rect x="1320" y="100" width="205" height="120" rx="16" class="aws"/><text x="1356" y="148" class="label">Amazon SES</text><text x="1356" y="175" class="small">two-way email</text>
  <rect x="1320" y="290" width="205" height="120" rx="16" class="aws"/><text x="1347" y="338" class="label">AWS EUM Social</text><text x="1347" y="365" class="small">WhatsApp Business</text>
  <rect x="1320" y="480" width="205" height="120" rx="16" class="external"/><text x="1361" y="528" class="label">Departments</text><text x="1361" y="555" class="small">email • WhatsApp</text>
  <rect x="350" y="650" width="220" height="130" rx="16" class="store"/><text x="383" y="698" class="label">Aurora + RDS API</text><text x="383" y="725" class="small">cases, evidence, delivery</text><text x="383" y="749" class="small">configuration, audit</text>
  <rect x="670" y="650" width="210" height="130" rx="16" class="store"/><text x="711" y="698" class="label">S3 + Secrets</text><text x="711" y="725" class="small">objects &amp; credentials</text>
  <path d="M260 415H350" class="line"/><path d="M570 415H670" class="line"/><path d="M880 415H980" class="line"/><path d="M1225 365H1320" class="line"/><path d="M1422 410V480" class="line"/><path d="M1422 480V220" class="dash"/><path d="M1320 160H1225" class="line"/><path d="M670 190L570 360" class="line"/><path d="M460 495V650" class="line"/><path d="M775 495V650" class="line"/><path d="M1100 545V640" class="line"/>
  <text x="72" y="850" class="sub">Core safety: original evidence is retained; permitted facts and restrictions are checked before handoff; delivery success is not treated as business completion.</text>
</svg>
