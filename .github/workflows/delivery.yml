name: Foundation delivery
on:
  push:
    branches: [main]
    paths: ['apps/**', 'packages/**', 'infra/**', 'scripts/**', 'package*.json', 'tsconfig.json', '.github/workflows/**']
  pull_request:
    paths: ['apps/**', 'packages/**', 'infra/**', 'scripts/**', 'package*.json', 'tsconfig.json', '.github/workflows/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: foundation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run publication:check
      - run: npm run build
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: '1.15.8'
      - run: terraform fmt -check -recursive infra
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    environment: ilien
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    env:
      TF_IN_AUTOMATION: 'true'
      TF_VAR_reconciliation_minutes: ${{ vars.RECONCILIATION_MINUTES || '60' }}
      TF_VAR_app_domain: ${{ vars.APP_DOMAIN }}
      TF_VAR_custom_domain_ready: ${{ vars.CUSTOM_DOMAIN_READY || 'false' }}
      TF_VAR_source_principal_arn: ${{ vars.SOURCE_PRINCIPAL_ARN }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_VAR_mail_domain: mail.${{ vars.APP_DOMAIN }}
      TF_VAR_whatsapp_phone_number_id: ${{ vars.WHATSAPP_PHONE_NUMBER_ID }}
      TF_VAR_whatsapp_waba_id: ${{ vars.WHATSAPP_WABA_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts && npm run build
      - name: Package explicit Lambda outputs
        run: node scripts/package.mjs
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: '1.15.8'
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Upload content-addressed Lambda packages
        env:
          ARTIFACT_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          for name in api relay intake migrate coordination channel-send channel-receive agent result reconcile; do
            HASH=$(sha256sum "dist/$name.zip" | cut -d " " -f 1)
            aws s3 cp "dist/$name.zip" "s3://$ARTIFACT_BUCKET/ilien/artifacts/$HASH.zip" --sse AES256 --only-show-errors
          done
      - name: Initialize deployment state
        working-directory: infra/project
        env:
          STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: terraform init -input=false -lockfile=readonly -backend-config="bucket=$STATE_BUCKET"
      - name: Plan and guard destructive changes
        working-directory: infra/project
        run: |
          terraform plan -input=false -out=deployment.tfplan > plan.log
          terraform show -json deployment.tfplan > deployment.json
          node ../../scripts/plan-guard.mjs deployment.json
      - name: Apply exact plan
        working-directory: infra/project
        run: terraform apply -input=false deployment.tfplan
      - name: Apply database migration
        run: node scripts/migrate.mjs
      - name: Configure existing WhatsApp destination
        run: node scripts/configure-whatsapp.mjs
      - name: Publish endpoint and release identity
        working-directory: infra/project
        run: |
          URL=$(terraform output -raw api_url)
          curl --fail --retry 3 "$URL/health"
          printf '### Foundation deployment\nCommit: `%s`\nAPI: %s\n' "$GITHUB_SHA" "$URL" >> "$GITHUB_STEP_SUMMARY"
